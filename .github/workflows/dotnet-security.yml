name: .NET 10 security remediation CI

on:
  push:
    branches:
      - security/remediation
      - security/audit-hardening
  pull_request:
    branches:
      - main
      - security/remediation

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore application
        run: dotnet restore "IT Form.csproj"

      - name: Build application
        run: dotnet build "IT Form.csproj" --configuration Release --no-restore

      - name: Run application tests
        run: dotnet test "IT_Form.Tests/IT_Form.Tests.csproj" --configuration Release --verbosity normal

      - name: Run audit tests
        run: dotnet test "IT_Form.AuditTests/IT_Form.AuditTests.csproj" --configuration Release --verbosity normal
